name: Build and Test

on:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3.6'

    - name: Install Composer dependencies
      run: composer install --ignore-platform-reqs

#    - name: Run tests
#      run: php artisan test
